name: Release

# Push a tag like v0.1.0 to build the ipk, publish a GitHub Release, and
# update the Homebrew Channel repository on GitHub Pages:
#   https://michaellunzer.github.io/webos-sports-autopilot/apps.json
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  TOOLCHAIN_URL: https://github.com/openlgtv/buildroot-nc4/releases/download/webos-d7ed7ee/arm-webos-linux-gnueabi_sdk-buildroot.tar.gz
  TOOLCHAIN_SHA256: 32816626e99fb34922a49d0c639f7c8a30356fffb222372d4823027f1382f640
  TOOLCHAIN_DIR: /opt/arm-webos-linux-gnueabi_sdk-buildroot
  TOOLCHAIN_FILE: /opt/arm-webos-linux-gnueabi_sdk-buildroot/share/buildroot/toolchainfile.cmake

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install webOS CLI
        run: sudo npm install --location=global @webosose/ares-cli
      - name: Download toolchain
        working-directory: /opt
        run: |
          wget -q -O toolchain.tar.gz "$TOOLCHAIN_URL"
          echo "$TOOLCHAIN_SHA256  toolchain.tar.gz" | sha256sum -c -
          tar xf toolchain.tar.gz
          cd "$TOOLCHAIN_DIR" && ./relocate-sdk.sh
      - name: Host tests
        run: |
          cmake -S . -B build-host -DHOST_BUILD=ON
          cmake --build build-host -j
          cd build-host && ctest --output-on-failure
      - name: Work out version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.0.0-dev.$GITHUB_RUN_NUMBER"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
      - name: Build ipk
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: scripts/build-ipk.sh
      - name: Generate Homebrew Channel repository
        run: |
          IPK=$(ls dist/*.ipk)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.ver.outputs.tag }}/$(basename "$IPK")"
          SITE="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          scripts/make-repo.sh "$IPK" "${{ steps.ver.outputs.version }}" "$URL" "$SITE" site
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.ipk
            site/manifest.json
      - uses: actions/upload-pages-artifact@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deploy
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/deploy-pages@v4
