<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>NFL Autopilot</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header>
    <h1>🏈 NFL Autopilot</h1>
    <div id="badge" class="badge off">OFF</div>
  </header>

  <main>
    <section class="panel">
      <h2>Remote buttons</h2>
      <table class="keys">
        <tr><td><span class="dot green"></span>Green</td><td>Autopilot on</td></tr>
        <tr><td><span class="dot red"></span>Red</td><td>Autopilot off</td></tr>
        <tr><td><span class="dot yellow"></span>Yellow</td><td>Switch Multiview / Full screen mode</td></tr>
        <tr><td><span class="dot blue"></span>Blue</td><td>Show status</td></tr>
      </table>
      <p class="hint">Open Multiview in YouTube TV, then press Green.</p>
    </section>

    <section class="panel">
      <h2>Status</h2>
      <div id="tiles" class="tiles"></div>
      <dl id="status"></dl>
    </section>

    <section class="panel actions">
      <h2>Controls</h2>
      <button class="btn" data-action="enable">Turn on</button>
      <button class="btn" data-action="disable">Turn off</button>
      <button class="btn" data-action="mode">Mode: <span id="modeLabel">-</span></button>
      <button class="btn" data-action="record">Start recording</button>
      <button class="btn" data-action="testkey">Test key (RIGHT)</button>
      <button class="btn" data-action="elevate">Grant root (first run)</button>
    </section>

    <section class="panel">
      <h2>Debug page</h2>
      <p id="debugUrl">-</p>
      <pre id="log"></pre>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
